<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        Employee Payroll
    </header>

    <div class="container">
        <div class="form-content">
            <form class="form" action="#" onsubmit="return false">

                <div class="form-head">
                    Employee Payroll Form
                </div>


                <div class="row-content">
                    <label class="label text" for="name">Name</label>
                    <input class="input" type="text" id="name" name="name"
                           placeholder="Your name.." required>
                </div>


                <div class="row-content">
                    <label class="label text" for="profile">Profile image</label>

                    <div class="profile-radio-content">

                        <label>
                            <input type="radio" name="profile"
                                   value="./assets/profile-images/Ellipse -3.png" required>
                            <img class="profile"
                                 src="./assets/profile-images/Ellipse -3.png" />
                        </label>

                        <label>
                            <input type="radio" name="profile"
                                   value="./assets/profile-images/Ellipse 1.png">
                            <img class="profile"
                                 src="./assets/profile-images/Ellipse 1.png" />
                        </label>

                        <label>
                            <input type="radio" name="profile"
                                   value="./assets/profile-images/Ellipse -8.png">
                            <img class="profile"
                                 src="./assets/profile-images/Ellipse -8.png" />
                        </label>

                        <label>
                            <input type="radio" name="profile"
                                   value="./assets/profile-images/Ellipse -7.png">
                            <img class="profile"
                                 src="./assets/profile-images/Ellipse -7.png" />
                        </label>

                    </div>
                </div>
                <div class="row-content">
                    <label class="label text" for="gender">
                        Gender
                    </label>
                    <div>
                        <input type="radio" id="male" name="gender" value="male">
                        <label class="text" for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="Female">
                        <label class="text" for="female">Female</label>
                    </div>
                </div>
                <div class="row-content">
                    <label class="label text" for="department">Department</label>
                    <div>
                        <input class="checkbox" type="checkbox" id="hr" name="department" value="HR">
                        <label class="text" for="hr">HR</label>
                        <input class="checkbox" type="checkbox" id="sales" name="department" value="Sales">
                        <label class="text" for="sales">Sales</label>
                        <input class="checkbox" type="checkbox" id="finance" name="department" value="Finance">
                        <label class="text" for="finance">Finance</label>
                        <input class="checkbox" type="checkbox" id="engineer" name="department" value="Engineer">
                        <label class="text" for="engineer">Engineer</label>
                        <input class="checkbox" type="checkbox" id="other" name="department" value="Other">
                        <label class="text" for="other">Other</label>
                    </div>
                </div>
                <div class="row-content">
                    <label class="label text" for="salary">Choose your salary:</label>
                    <input class="input" type="range" id="salary" name="salary" min="300000" max="500000" step="100" value="400000" oninput="salaryOutput.value= salary.value">
                    <output class="salary-output text" id="salaryOutput">400000</output>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
